<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Returning to My Health Pal</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  body { font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; background: #F4F6F5; color: #14201C;
         margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 380px; text-align: center; }
  a { display: inline-block; margin-top: 16px; background: #0B5C6B; color: #fff; padding: 14px 22px;
      border-radius: 12px; text-decoration: none; font-weight: 700; }
  p { color: #5D6B66; line-height: 1.5; }
</style>
</head>
<body>
<div class="box">
  <div style="width:72px;height:72px;margin:0 auto 16px"><svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" role="img" aria-label="My Health Pal logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0B5C6B"/><g transform="translate(0 0) scale(1)">
<path d="M112 168 C 180 168 206 228 250 232" fill="none" stroke="#7FE0C2" stroke-width="16" stroke-linecap="round"/>
<path d="M112 256 L 250 256" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
<path d="M112 344 C 180 344 206 284 250 280" fill="none" stroke="#F2B544" stroke-width="16" stroke-linecap="round"/>
<circle cx="112" cy="168" r="22" fill="#7FE0C2"/>
<circle cx="112" cy="256" r="22" fill="#FFFFFF"/>
<circle cx="112" cy="344" r="22" fill="#F2B544"/>
<rect x="308" y="152" width="80" height="208" rx="22" fill="#FFFFFF"/>
<rect x="244" y="216" width="208" height="80" rx="22" fill="#FFFFFF"/>
<polyline points="268,256 300,256 316,226 336,288 354,240 366,256 428,256" fill="none" stroke="#E2453A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>
  <h1 id="title">Returning to My Health Pal…</h1>
  <p id="msg">If the app doesn't open on its own, tap the button below.</p>
  <a id="go" href="#" hidden>Open My Health Pal</a>
</div>
<script>
  // HealthEx only accepts https return addresses, so sign-in lands here and
  // this page hands the result straight back to the app. It forwards only to
  // the app's own addresses (exp://, exps://, healthconnect://), never to a website.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var state = params.get("state") || "";
    var dot = state.indexOf(".");
    var target = "";
    try { target = dot >= 0 ? decodeURIComponent(state.slice(dot + 1)) : ""; } catch (e) { target = ""; }
    if (!/^(exp|exps|healthconnect):\/\//i.test(target)) target = "healthconnect://oauth";

    var keep = new URLSearchParams();
    ["code", "state", "error", "error_description", "iss"].forEach(function (k) {
      if (params.has(k)) keep.set(k, params.get(k));
    });
    var dest = target + (target.indexOf("?") >= 0 ? "&" : "?") + keep.toString();

    // Remove the code from this page's address and history right away.
    try { history.replaceState(null, "", window.location.pathname); } catch (e) {}

    var link = document.getElementById("go");
    link.href = dest;
    link.hidden = false;
    if (!params.has("code") && !params.has("error")) {
      document.getElementById("title").textContent = "My Health Pal sign-in";
      document.getElementById("msg").textContent = "This page is only used during sign-in. You can close it.";
      link.hidden = true;
      return;
    }
    window.location.replace(dest);
  })();
</script>
</body>
</html>
